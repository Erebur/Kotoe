<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024">

  <!-- App icon background -->
  <rect width="1024" height="1024" rx="220" fill="#F7F0E5"/>

  <!-- Back flashcard -->
  <g transform="rotate(10 540 440)">
    <rect x="290" y="240" width="460" height="510"
          rx="48" fill="#E8B65B"/>
  </g>

  <!-- Main flashcard -->
  <g transform="rotate(-6 500 470)">
    <rect x="260" y="220" width="460" height="510"
          rx="48" fill="#FFFFFF"/>

    <!-- Japanese-inspired accent -->
    <rect x="260" y="220" width="460" height="18"
          rx="9" fill="#D9684A"/>

    <!-- Japanese character -->
    <text x="490" y="500"
          font-family="sans-serif"
          font-size="240"
          font-weight="600"
          text-anchor="middle"
          fill="#263F38">言</text>

    <!-- Decorative divider -->
    <rect x="405" y="555" width="170" height="8"
          rx="4" fill="#E8B65B"/>

    <!-- Japanese text -->
    <text x="490" y="620"
          font-family="sans-serif"
          font-size="44"
          letter-spacing="8"
          text-anchor="middle"
          fill="#D9684A">ことば</text>
  </g>

  <!-- Small learning spark -->
  <path d="M760 700 L780 750 L830 770
           L780 790 L760 840 L740 790
           L690 770 L740 750 Z"
        fill="#D9684A"/>
</svg>